name: Deploy Secure Console to Netlify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'netlify.toml'
      - '.github/workflows/netlify-production-deploy.yml'

permissions:
  contents: read

concurrency:
  group: secure-console-netlify-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: d38975e1-8294-4c00-87f0-4057ed15c6ec
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check deployment authorization
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error::Set repository secret NETLIFY_AUTH_TOKEN to authorize publishing to existing Netlify site."
            exit 1
          fi
      - name: Build production web console
        working-directory: web
        run: |
          npm ci --include=dev
          npm run build
          printf '/*  /index.html  200\n' > dist/_redirects
          test -s dist/index.html
      - name: Publish verified build to existing production site
        run: |
          npx --yes netlify-cli@latest deploy --prod --no-build --dir=web/dist --site="$NETLIFY_SITE_ID" --message="Secure Console ${{ github.sha }}"
      - name: Check public site routes
        run: |
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --output /dev/null https://secure.creccommw.org/
          curl --fail --silent --show-error --location --retry 3 --retry-delay 3 --output /dev/null https://secure.creccommw.org/settings
