name: Materialize USB Audit V1.2 Source

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: usb-audit-materialize
  cancel-in-progress: true

jobs:
  materialize-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize normal source tree
        shell: pwsh
        run: |
          if (Test-Path "src/UsbAudit.App/UsbAudit.App.csproj") {
            Write-Host "Source is already materialized."
            exit 0
          }

          $parts = @(Get-ChildItem ".bootstrap\part*.b64" | Sort-Object Name)
          if ($parts.Count -ne 5) {
            throw "Expected 5 bootstrap parts, found $($parts.Count)."
          }

          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          $bytes = [Convert]::FromBase64String($base64)
          $zip = Join-Path $env:RUNNER_TEMP "UsbAuditSource.zip"
          [IO.File]::WriteAllBytes($zip, $bytes)

          $extract = Join-Path $env:RUNNER_TEMP "UsbAuditSource"
          Expand-Archive $zip $extract -Force
          $source = Join-Path $extract "usb-audit"
          if (-not (Test-Path (Join-Path $source "UsbAudit.sln"))) {
            throw "The reconstructed source package is invalid."
          }

          # Copy the normal project tree but preserve the repository's current workflow directory.
          Get-ChildItem $source -Force |
            Where-Object { $_.Name -notin @('.git', '.github', '.bootstrap') } |
            ForEach-Object {
              $target = Join-Path $PWD $_.Name
              if (Test-Path $target) {
                Remove-Item $target -Recurse -Force
              }
              Copy-Item $_.FullName $target -Recurse -Force
            }

          # Restore the corrected dashboard byte-for-byte from Base64.
          $safeSource = ".bootstrap\MainWindow.xaml.cs.b64"
          $mainWindow = "src\UsbAudit.App\MainWindow.xaml.cs"
          $dashboardBytes = [Convert]::FromBase64String((Get-Content $safeSource -Raw).Trim())
          [IO.File]::WriteAllBytes((Join-Path $PWD $mainWindow), $dashboardBytes)

          # Final WPF compile fixes, written with explicit UTF-8 bytes.
          $utf8 = [Text.UTF8Encoding]::new($false)
          $mainWindowPath = (Join-Path $PWD $mainWindow)
          $dashboardText = $utf8.GetString([IO.File]::ReadAllBytes($mainWindowPath))
          if (-not $dashboardText.Contains("using System.IO;")) {
            $dashboardText = "using System.IO;`n" + $dashboardText
          }
          [IO.File]::WriteAllBytes($mainWindowPath, $utf8.GetBytes($dashboardText))

          $handlers = @'
          using System.Windows;
          using System.Windows.Controls;

          namespace UsbAudit.App;

          public partial class MainWindow
          {
              private void Refresh_Click(object sender, RoutedEventArgs e)
              {
                  RefreshData();
              }

              private void TransferSearchBox_TextChanged(object sender, TextChangedEventArgs e)
              {
                  ApplyTransferFilter();
              }

              private void DirectionFilter_SelectionChanged(object sender, SelectionChangedEventArgs e)
              {
                  ApplyTransferFilter();
              }
          }
          '@
          [IO.File]::WriteAllBytes((Join-Path $PWD "src\UsbAudit.App\MainWindow.EventHandlers.cs"), $utf8.GetBytes($handlers))

          Remove-Item ".bootstrap" -Recurse -Force

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if (-not (git status --porcelain)) {
            Write-Host "Nothing to commit."
            exit 0
          }

          git commit -m "Materialize USB Audit V1.2 production source"
          git push origin main
