name: Validate Smart Console web changes

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'supabase/functions/terminal-admin/**'
      - 'supabase/functions/usb-audit-ingest/**'
      - '.github/workflows/web-check.yml'

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Restore frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck and build
        working-directory: web
        run: npm run build
