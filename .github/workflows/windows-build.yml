name: Build and Release Smart Console

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
      - 'UsbAudit.sln'
      - 'SmartConsoleOnlineInstaller.cmd'
      - 'Install Smart Console.cmd'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'installer/**'
      - '.github/workflows/windows-build.yml'
      - 'UsbAudit.sln'
      - 'SmartConsoleOnlineInstaller.cmd'
      - 'Install USB Audit.cmd'

permissions:
  contents: write

concurrency:
  group: usb-audit-production-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $version = "1.2.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Smart Console $version"

      - name: Prepare CRECCOM branding
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Prepare-Branding.ps1

      - name: Restore
        shell: pwsh
        run: dotnet restore UsbAudit.sln

      - name: Publish Agent
        shell: pwsh
        run: dotnet publish src/UsbAudit.Agent/UsbAudit.Agent.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o dist/publish/Agent

      - name: Publish App
        shell: pwsh
        run: dotnet publish src/UsbAudit.App/UsbAudit.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o dist/publish/App

      - name: Publish Microsoft 365 identity helper
        shell: pwsh
        run: dotnet publish src/UsbAudit.Identity/UsbAudit.Identity.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o dist/publish/Identity

      - name: Dashboard runtime smoke test
        shell: pwsh
        run: |
          $log = Join-Path $env:ProgramData "UsbAudit\Data\ui-startup.log"
          if (Test-Path $log) { Remove-Item $log -Force }

          $dll = (Resolve-Path "dist\publish\App\SmartConsole.dll").Path
          & dotnet $dll --smoke-test
          $code = $LASTEXITCODE

          if (Test-Path $log) {
            Write-Host "--- Smart Console startup log ---"
            Get-Content $log
            Write-Host "-----------------------------"
          }

          if ($code -ne 0) {
            throw "Smart Console dashboard runtime smoke test failed with exit code $code."
          }

      - name: Validate updater PowerShell syntax
        shell: pwsh
        run: |
          $scripts = @('scripts/Apply-UsbAuditUpdate.ps1', 'scripts/Install-UsbAudit.ps1')
          foreach ($path in $scripts) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { $errors | ForEach-Object { Write-Error $_ }; throw "Invalid updater script: $path" }
            Write-Host "Syntax verified: $path"
          }

      - name: Regression - atomically move legacy nested Identity folders
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'creccom-atomic-update-regression'
          $install = Join-Path $root 'Install'
          $legacy = Join-Path $install 'Identity'
          $backup = Join-Path $install '.rollback-regression'
          $target = Join-Path $backup 'Identity'
          New-Item -ItemType Directory -Path $legacy,$backup -Force | Out-Null
          $nested = $legacy
          for ($i = 0; $i -lt 12; $i++) {
            $nested = Join-Path $nested 'Identity'
            New-Item -ItemType Directory -Path $nested -Force | Out-Null
          }
          $original = Join-Path $nested 'NativeInterop.dll'
          Set-Content -LiteralPath $original -Value 'legacy-build' -Encoding ascii
          Move-Item -LiteralPath $legacy -Destination $target -ErrorAction Stop
          if (Test-Path -LiteralPath $legacy) { throw 'Old Identity folder still exists.' }
          if (-not (Test-Path -LiteralPath (Join-Path $target ($original.Substring($legacy.Length).TrimStart('\'))))) { throw 'Deep legacy tree not preserved in backup.' }
          New-Item -ItemType Directory -Path $legacy -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $legacy 'new.dll') -Value 'new-build'
          Remove-Item -LiteralPath $legacy -Recurse -Force
          Move-Item -LiteralPath $target -Destination $legacy -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $original)) { throw 'Original directory failed to roll back.' }
          Write-Host 'Atomic same-volume backup/rollback regression passed.'

      - name: Assemble release package
        shell: pwsh
        run: |
          Copy-Item scripts/Install-UsbAudit.ps1 dist/publish/
          Copy-Item scripts/Uninstall-UsbAudit.ps1 dist/publish/
          Copy-Item scripts/Apply-UsbAuditUpdate.ps1 dist/publish/
          Copy-Item scripts/Install-Latest-UsbAudit.ps1 dist/publish/
          New-Item -ItemType Directory -Path dist/publish/Branding -Force | Out-Null
          Copy-Item assets/CRECCOM.ico dist/publish/Branding/CRECCOM.ico -Force
          Copy-Item README.md dist/publish/
          Compress-Archive -Path dist/publish/* -DestinationPath dist/UsbAudit-win-x64.zip -Force

          $hash = (Get-FileHash dist/UsbAudit-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UsbAudit-win-x64.zip" | Set-Content dist/UsbAudit-win-x64.zip.sha256 -Encoding ascii

      - name: Build one-click Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          $sourceRoot = (Resolve-Path "dist/publish").Path
          $outputDir = (Resolve-Path "dist").Path
          & $iscc "/DSourceRoot=$sourceRoot" "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputDir=$outputDir" "installer/UsbAuditSetup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

          $setupHash = (Get-FileHash dist/SmartConsoleSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  SmartConsoleSetup.exe" | Set-Content dist/SmartConsoleSetup.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: UsbAudit-win-x64-${{ steps.version.outputs.version }}
          path: |
            dist/UsbAudit-win-x64.zip
            dist/UsbAudit-win-x64.zip.sha256
            dist/SmartConsoleSetup.exe
            dist/SmartConsoleSetup.exe.sha256
            SmartConsoleOnlineInstaller.cmd

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag `
              dist/UsbAudit-win-x64.zip `
              dist/UsbAudit-win-x64.zip.sha256 `
              dist/SmartConsoleSetup.exe `
              dist/SmartConsoleSetup.exe.sha256 `
              SmartConsoleOnlineInstaller.cmd `
              --clobber
          } else {
            gh release create $tag `
              dist/UsbAudit-win-x64.zip `
              dist/UsbAudit-win-x64.zip.sha256 `
              dist/SmartConsoleSetup.exe `
              dist/SmartConsoleSetup.exe.sha256 `
              SmartConsoleOnlineInstaller.cmd `
              --title "Smart Console ${{ steps.version.outputs.version }}" `
              --generate-notes `
              --latest
          }
