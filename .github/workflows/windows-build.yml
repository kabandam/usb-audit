name: Build and Release USB Audit

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'installer/**'
      - 'UsbAudit.sln'
      - 'UsbAuditOnlineInstaller.cmd'
      - 'Install USB Audit.cmd'

permissions:
  contents: write

concurrency:
  group: usb-audit-production-release
  cancel-in-progress: true

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set release version
        id: version
        shell: pwsh
        run: |
          $version = "1.2.${{ github.run_number }}"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building USB Audit $version"

      - name: Restore
        shell: pwsh
        run: dotnet restore UsbAudit.sln

      - name: Publish Agent
        shell: pwsh
        run: dotnet publish src/UsbAudit.Agent/UsbAudit.Agent.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o dist/publish/Agent

      - name: Publish App
        shell: pwsh
        run: dotnet publish src/UsbAudit.App/UsbAudit.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o dist/publish/App

      - name: Assemble release package
        shell: pwsh
        run: |
          Copy-Item scripts/Install-UsbAudit.ps1 dist/publish/
          Copy-Item scripts/Uninstall-UsbAudit.ps1 dist/publish/
          Copy-Item scripts/Apply-UsbAuditUpdate.ps1 dist/publish/
          Copy-Item scripts/Install-Latest-UsbAudit.ps1 dist/publish/
          Copy-Item README.md dist/publish/
          Compress-Archive -Path dist/publish/* -DestinationPath dist/UsbAudit-win-x64.zip -Force

          $hash = (Get-FileHash dist/UsbAudit-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  UsbAudit-win-x64.zip" | Set-Content dist/UsbAudit-win-x64.zip.sha256 -Encoding ascii

      - name: Build one-click Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }

          $sourceRoot = (Resolve-Path "dist/publish").Path
          $outputDir = (Resolve-Path "dist").Path
          & $iscc "/DSourceRoot=$sourceRoot" "/DAppVersion=${{ steps.version.outputs.version }}" "/DOutputDir=$outputDir" "installer/UsbAuditSetup.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

          $setupHash = (Get-FileHash dist/UsbAuditSetup.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$setupHash  UsbAuditSetup.exe" | Set-Content dist/UsbAuditSetup.exe.sha256 -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: UsbAudit-win-x64-${{ steps.version.outputs.version }}
          path: |
            dist/UsbAudit-win-x64.zip
            dist/UsbAudit-win-x64.zip.sha256
            dist/UsbAuditSetup.exe
            dist/UsbAuditSetup.exe.sha256
            UsbAuditOnlineInstaller.cmd

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          if (gh release view $tag 2>$null) {
            gh release upload $tag `
              dist/UsbAudit-win-x64.zip `
              dist/UsbAudit-win-x64.zip.sha256 `
              dist/UsbAuditSetup.exe `
              dist/UsbAuditSetup.exe.sha256 `
              UsbAuditOnlineInstaller.cmd `
              --clobber
          } else {
            gh release create $tag `
              dist/UsbAudit-win-x64.zip `
              dist/UsbAudit-win-x64.zip.sha256 `
              dist/UsbAuditSetup.exe `
              dist/UsbAuditSetup.exe.sha256 `
              UsbAuditOnlineInstaller.cmd `
              --title "USB Audit ${{ steps.version.outputs.version }}" `
              --generate-notes `
              --latest
          }
